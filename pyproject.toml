[project]
name = "contractnet"
version = "0.1.0"
description = "Contract-driven multi-agent collaboration scheduling framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "redis>=5.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "jsonschema>=4.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
eval = ["pytest>=8.0", "pytest-asyncio>=0.23"]
all = ["contractnet[dashboard,eval]"]

[project.scripts]
contractnet = "contractnet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
